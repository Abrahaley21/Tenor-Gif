
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenor GIF Search</title>
    <link rel="stylesheet" href="Tenor.css">
</head>
<body>
    <div class="container">
        <h1>Tenor GIF Search</h1>
        <p>Search for your favorite GIFs!</p>
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search for cats, dogs, funny..."
            >
            <button id="searchButton">Search</button>
        </div>
        <p id="message"></p>
        <div id="gifResults" class="gif-grid"></div>
    </div>
    <script src="JVV.js"></script>
</body>
</html>
